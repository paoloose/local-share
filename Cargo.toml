[package]
name = "paoloose-share"
version = "0.1.0"
edition = "2021"
description = "paoloose share: a shared bucket for dropping files"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
log = "0.4"
futures = "0.3"

axum = { version = "0.8", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["fs", "compression-gzip"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "time"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
leptos_axum = { version = "0.8", optional = true }
notify = { version = "8", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "macros"], optional = true }
percent-encoding = "2"
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "Node",
  "Event",
  "EventTarget",
  "EventListener",
  "EventSource",
  "MessageEvent",
  "KeyboardEvent",
  "Storage",
  "Location",
  "Url",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "Blob",
  "File",
  "FileList",
  "DataTransfer",
  "DragEvent",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlFormElement",
  "HtmlSelectElement",
  "HtmlButtonElement",
  "DomTokenList",
  "AddEventListenerOptions",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["ssr"]
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
]
ssr = [
  "leptos/ssr",
  "leptos_router/ssr",
  "leptos_meta/ssr",
  "dep:axum",
  "dep:tower",
  "dep:tower-http",
  "dep:tokio",
  "dep:tokio-util",
  "dep:leptos_axum",
  "dep:notify",
  "dep:uuid",
  "dep:time",
]

# Size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "paoloose-share"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:7777"
reload-port = 7778
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
